# Packaging and publishing, run by pushing a v* tag.
# Marketplace authenticates with Trusted Publishing (OIDC, no stored token);
# Open VSX still needs OVSX_PAT. Create the Marketplace policy with:
#   Repository owner: LingChen-tsjmdlc
#   Repository:       pyside-iconify-vscode
#   Workflow:         publish.yml
#   Environment:      release
name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for the Marketplace OIDC exchange
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and lint
        run: pnpm run compile && pnpm run lint

      - name: Test on the minimum and the stable VS Code
        run: pnpm test

      - name: Package
        id: package
        shell: bash
        # bash syntax below; the Windows default shell is pwsh
        # Runtime JavaScript is bundled; WASM files are copied by compile.
        run: |
          npx @vscode/vsce@latest package --no-dependencies
          echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged extension without development dependencies
        run: pnpm run verify:vsix "${{ steps.package.outputs.vsix }}"

      - name: Publish to the VS Code Marketplace
        # --skip-duplicate: the same version is often published to both
        # marketplaces in separate runs; the second run must not fail
        run: npx @vscode/vsce@latest publish --packagePath "${{ steps.package.outputs.vsix }}" --oidc --skip-duplicate

      - name: Publish to Open VSX
        run: npx ovsx publish "${{ steps.package.outputs.vsix }}" --skip-duplicate --pat "${{ secrets.OVSX_PAT }}"
